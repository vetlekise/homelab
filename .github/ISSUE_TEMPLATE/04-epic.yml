name: Epic
description: Create a high-level parent issue to track a large initiative or project.
labels: ["epic"]
assignees:
  - vetlekise
projects: ["vetlekise/8"]
body:
  - type: markdown
    attributes:
      value: |
        **Title format:** `<large outcome>`
        - `Overhaul home network for security and redundancy`
        - `Centralize monitoring and alerting`

        Break the work into child issues and link them as sub-issues after creating this.

  - type: textarea
    id: epic-description
    attributes:
      label: High-Level Goal
      description: "What is the overarching objective of this epic?"
      placeholder: "e.g., Overhaul the home network infrastructure for better security and redundancy."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: "Why are we doing this? What is the overarching benefit?"
      placeholder: "e.g., To eliminate single points of failure and ensure secure remote access."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "What must be true for this epic to be complete? (Child issues handle the specific tasks)"
      placeholder: "- [ ] Primary and backup routers configured\n- [ ] VPN access established\n- [ ] Legacy network retired"
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope / Notes
      description: "What is explicitly not part of this epic?"
    validations:
      required: false
