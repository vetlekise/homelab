name: pr-title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize # needed so the check reports on new commits when it is required

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
