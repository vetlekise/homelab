name: Build and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - hugo.yaml
      - go.mod
      - go.sum
      - .github/workflows/hugo.yaml

env:
  HUGO_VERSION: 0.168.0
  TZ: Europe/Oslo

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo
        run: |
          curl -sfL --output "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${RUNNER_TEMP}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          go version
          hugo version

      - name: Configure Git
        run: git config --global core.quotepath false

      - name: Restore Hugo cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: |
            hugo-

      - name: Build
        env:
          HUGO_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${HUGO_BASE_URL}" \
            --cacheDir "${RUNNER_TEMP}/.cache/hugo"

      - name: Save Hugo cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
