name: renovate

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate-version: 44.198.0
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_USERNAME: github-actions[bot]
          RENOVATE_GIT_AUTHOR: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>
          RENOVATE_IGNORE_PATHS: '[".github/workflows/**"]'
