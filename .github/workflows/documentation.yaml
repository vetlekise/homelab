name: documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - hugo/**
      - hugo.yaml
      - go.mod
      - go.sum
      - mise.toml
      - .github/workflows/documentation.yaml

env:
  TZ: Europe/Oslo

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install Go and Hugo
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          install_args: go aqua:gohugoio/hugo

      - name: Log tool versions
        run: |
          go version
          hugo version

      - name: Configure Git
        run: git config --global core.quotepath false

      - name: Restore Hugo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: |
            hugo-

      - name: Build
        env:
          HUGO_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${HUGO_BASE_URL}" \
            --cacheDir "${RUNNER_TEMP}/.cache/hugo"

      - name: Save Hugo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-slim
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
