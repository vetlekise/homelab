version: "3"

tasks:
  setup:
    desc: Install extra tools and run lint checks
    cmds:
      - pre-commit install
      - task: lint

  lint:
    desc: Run pre-commit checks on all tracked files
    cmds:
      - pre-commit run --all-files

  docs:serve:
    desc: Preview the documentation locally (includes drafts)
    cmds:
      - hugo server --buildDrafts --disableFastRender

  docs:build:
    desc: Build the documentation site
    cmds:
      - hugo --gc --minify
