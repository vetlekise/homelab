baseURL: https://vetlekise.github.io/homelab/
locale: en
title: Vetle's Homelab
contentDir: docs
assetDir: hugo/assets
staticDir: hugo/static
layoutDir: hugo/layouts

params:
  page:
    width: full
  navbar:
    width: full
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      width: 39
      height: 32

caches:
  images:
    dir: :cacheDir/images

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      url: https://github.com/vetlekise/homelab
      weight: 3
      params:
        icon: github

markup:
  highlight:
    noClasses: false
