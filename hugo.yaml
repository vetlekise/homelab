baseURL: https://homelab.vetle.dev
locale: en
title: Vetle's Homelab
contentDir: docs
assetDir: hugo/assets
staticDir: hugo/static
layoutDir: hugo/layouts

params:
  page:
    width: full
  navbar:
    width: full
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      width: 39
      height: 32

caches:
  images:
    dir: :cacheDir/images

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Introduction
      url: /
      weight: 1
    - name: Emergency
      url: /guides/disaster-recovery/
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      url: https://github.com/vetlekise/homelab
      weight: 4
      params:
        icon: github

markup:
  goldmark:
    renderer:
      unsafe: true # needed so we can use html tags, e.g. <br>
  highlight:
    noClasses: false
